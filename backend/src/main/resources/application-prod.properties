# Spring Boot Production Configuration
server.port=${PORT:8080}

# Production Database Configuration (Aiven MySQL)
spring.datasource.url=${DB_URL:${DATABASE_URL:jdbc:mysql://localhost:3306/carbontrack}}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD:}


# Flyway Database Migration (Disabled on fallback, enabled when MySQL DATABASE_URL is set)
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=true
spring.flyway.repair-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Import secrets if available
spring.config.import=optional:file:./application-secret.properties


# Security & JWT
jwt.secret=${JWT_SECRET:carbontrackProductionSecretKeyForJwtSigningMustBeAtLeast256BitsLongForHMACSHA256}
jwt.expiration=86400000

# Jackson ISO dates
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd

# Google OAuth 2.0 Fallbacks
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:production-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:production-google-client-secret}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.provider.google.user-name-attribute=sub
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://accounts.google.com

# Mail Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Cache Configuration (Simple memory cache by default, Redis when configured)
spring.cache.type=${SPRING_CACHE_TYPE:simple}
spring.data.redis.repositories.enabled=false
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# Gemini AI API Configuration
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent

# First Admin Bootstrap
carbontrack.bootstrap.admin-email=${CARBONTRACK_ADMIN_EMAIL:admin@carbontrack.org}
carbontrack.bootstrap.admin-password=${CARBONTRACK_ADMIN_PASSWORD:AdminPassword123!}
carbontrack.demo.enabled=${CARBONTRACK_DEMO_ENABLED:true}
carbontrack.demo.password=${CARBONTRACK_DEMO_PASSWORD:Password@123}
